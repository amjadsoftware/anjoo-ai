<!doctype html>
<html lang="ur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1512">
<title>Anjoo AI</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --bg: #EEF2EE; --surface: #FFFFFF; --surface-2: #E4EBE5; --ink: #12201A; --muted: #5B6B63;
  --line: #D2DBD4; --accent: #0B7A62; --accent-ink: #FFFFFF; --user-bg: #0B7A62; --user-ink: #FFFFFF;
  --danger: #B4412F;
  --font: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Naskh Arabic', 'Noto Nastaliq Urdu', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0E1512; --surface: #17211C; --surface-2: #213029; --ink: #E6EFE9; --muted: #93A59B;
    --line: #27372F; --accent: #3FD2A5; --accent-ink: #04251B; --user-bg: #17695A; --user-ink: #F2FBF7;
    --danger: #F08A78; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5; }
button, textarea, input { font: inherit; color: inherit; }

.app {
  height: 100%; max-width: 720px; margin: 0 auto; display: flex; flex-direction: column;
  padding: env(safe-area-inset-top, 0) max(14px, env(safe-area-inset-right, 0)) env(safe-area-inset-bottom, 0) max(14px, env(safe-area-inset-left, 0));
}
.top { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.mark { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 800; font-size: 22px; flex: none; }
.who { flex: 1; min-width: 0; }
.who h1 { margin: 0; font-size: 19px; line-height: 1.2; }
.who p { margin: 0; font-size: 13px; color: var(--muted); }
.ghost { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 7px 13px; font-size: 14px; cursor: pointer; }
.ghost:active { background: var(--surface-2); }

.feed { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 0; display: flex; flex-direction: column; gap: 10px; overscroll-behavior: contain; }
.hello { margin: auto 0; }
.hello h2 { margin: 0 0 6px; font-size: clamp(26px, 8vw, 36px); line-height: 1.15; }
.hello p { margin: 0 0 16px; color: var(--muted); max-width: 36ch; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px 14px; font-size: 15px; text-align: start; cursor: pointer; }

.msg { max-width: 88%; padding: 10px 14px; border-radius: 18px; overflow-wrap: anywhere; white-space: pre-wrap; }
.msg.user { align-self: flex-end; background: var(--user-bg); color: var(--user-ink); border-bottom-right-radius: 6px; }
.msg.bot { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
.msg.err { align-self: flex-start; border: 1px dashed var(--danger); color: var(--danger); border-bottom-left-radius: 6px; }
.typing { display: inline-flex; gap: 4px; padding: 6px 0; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .typing i { animation: none; opacity: .6; } }

.card { align-self: stretch; border: 1px solid var(--accent); background: var(--surface); border-radius: 16px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; }
.card .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.card .t b { display: block; }
.card .t span { color: var(--muted); font-size: 14px; white-space: pre-wrap; }
.card a { background: var(--accent); color: var(--accent-ink); text-decoration: none; font-weight: 700; padding: 11px 18px; border-radius: 999px; flex: none; }

.composer { display: flex; align-items: flex-end; gap: 8px; padding: 10px 0 8px; border-top: 1px solid var(--line); }
.composer textarea { flex: 1; min-width: 0; resize: none; max-height: 130px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 11px 16px; outline: none; line-height: 1.4; }
.composer textarea:focus-visible { border-color: var(--accent); }
.send { flex: none; width: 46px; height: 46px; border: 0; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: 20px; cursor: pointer; }
.send:disabled { opacity: .4; }
.mic { width: 100%; height: 62px; margin-bottom: 10px; border: 0; border-radius: 32px; background: var(--accent); color: var(--accent-ink); font-size: 19px; font-weight: 700; cursor: pointer; }
.mic.on { background: var(--danger); color: #fff; }

dialog { width: min(92vw, 520px); border: 1px solid var(--line); border-radius: 18px; background: var(--surface); color: var(--ink); padding: 18px; }
dialog::backdrop { background: rgba(0,0,0,.5); }
dialog h3 { margin: 0 0 10px; }
dialog label { display: block; margin: 12px 0 4px; font-size: 14px; color: var(--muted); }
dialog input, dialog textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
dialog textarea { min-height: 84px; }
.row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.row .primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; padding: 10px 20px; font-weight: 700; }
.hint { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="mark" aria-hidden="true">A</div>
    <div class="who"><h1>Anjoo AI</h1><p id="status">Tayyar</p></div>
    <button class="ghost" id="langBtn" type="button">اردو</button>
    <button class="ghost" id="setBtn" type="button">Settings</button>
  </header>

  <main class="feed" id="feed" aria-live="polite">
    <section class="hello" id="hello">
      <h2>Assalam o Alaikum</h2>
      <p>Mic dabayein aur bolein, ya neeche likhein. Urdu, Roman Urdu ya English chalti hai.</p>
      <div class="chips" id="chips">
        <button class="chip" type="button">Ahmed ko WhatsApp par likho ke main der se aunga</button>
        <button class="chip" type="button">Lahore ka rasta dikhao</button>
        <button class="chip" type="button">Kal subah 9 baje ki meeting ka email likho</button>
        <button class="chip" type="button">Yaad rakho: meri dukaan jumma ko band hoti hai</button>
      </div>
    </section>
  </main>

  <form class="composer" id="form" autocomplete="off">
    <textarea id="input" rows="1" placeholder="Yahan likhein..." dir="auto" aria-label="Paigham"></textarea>
    <button class="send" id="send" type="submit" aria-label="Bhejein" disabled>&#8593;</button>
  </form>
  <button class="mic" id="mic" type="button">Bolein</button>
</div>

<dialog id="dlg">
  <form method="dialog" id="setForm">
    <h3>Settings</h3>
    <label for="keyIn">Gemini API key</label>
    <input id="keyIn" type="password" placeholder="AIza..." autocomplete="off">
    <p class="hint">Key aistudio.google.com/apikey se banayein. Yeh sirf is phone ke browser mein rehti hai.</p>
    <label for="modelIn">Model</label>
    <input id="modelIn" type="text" autocomplete="off">
    <label for="contactsIn">Contacts (har line mein: Naam: 03001234567)</label>
    <textarea id="contactsIn" dir="auto" spellcheck="false"></textarea>
    <label for="notesIn">Yaad rakhi baatein (har line ek baat)</label>
    <textarea id="notesIn" dir="auto"></textarea>
    <div class="row">
      <button class="ghost" value="cancel" type="submit">Band</button>
      <button class="primary" value="save" type="submit" id="saveBtn">Save</button>
    </div>
  </form>
</dialog>

<script>
(function () {
  var DEFAULT_MODEL = 'gemini-3.8-flash';
  var $ = function (id) { return document.getElementById(id); };
  var LS = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  var key = LS.get('key', '');
  var model = LS.get('model', DEFAULT_MODEL);
  var contacts = LS.get('contacts', {});
  var notes = LS.get('notes', []);
  var lang = 'ur-PK';
  var contents = [];
  var busy = false;
  var rec = null;
  var listening = false;

  var feed = $('feed'), hello = $('hello'), input = $('input'), sendBtn = $('send'), mic = $('mic');

  /* ---------- tools ---------- */
  var S = { type: 'string' };
  function fn(name, description, props, req) {
    var o = { name: name, description: description };
    if (props) o.parameters = { type: 'object', properties: props, required: req || [] };
    return o;
  }
  var DECLS = [
    fn('save_contact', 'Contact ka naam aur number app mein save karo.', { name: S, number: S }, ['name', 'number']),
    fn('call', "Kisi ko call karne ka button dikhao. 'to' mein saved contact ka naam ya number do.", { to: S }, ['to']),
    fn('send_sms', 'SMS ka draft kholne ka button dikhao.', { to: S, text: S }, ['to', 'text']),
    fn('whatsapp_message', 'WhatsApp chat kholne ka button dikhao, paigham likha hua hoga.', { to: S, text: S }, ['to', 'text']),
    fn('send_email', 'Email draft kholne ka button dikhao.', { to: S, subject: S, body: S }, ['subject', 'body']),
    fn('open_app', 'Koi mashhoor app ya website kholne ka button dikhao: whatsapp, youtube, facebook, instagram, telegram, x, gmail, maps, chrome, play store, phone, messages, tiktok.', { name: S }, ['name']),
    fn('web_search', 'Google search kholne ka button dikhao.', { query: S }, ['query']),
    fn('youtube_search', 'YouTube par search kholne ka button dikhao.', { query: S }, ['query']),
    fn('open_url', 'Website kholne ka button dikhao.', { url: S }, ['url']),
    fn('navigate', 'Google Maps mein rasta kholne ka button dikhao.', { place: S }, ['place']),
    fn('remember', "User ki zaroori baat yaad rakho (jab woh 'yaad rakho' kahe).", { text: S }, ['text']),
    fn('forget', 'Yaad rakhi baat bhula do; text mein us baat ka koi lafz do.', { text: S }, ['text'])
  ];

  function pkNum(n) {
    var d = String(n).replace(/\D/g, '');
    if (d.indexOf('00') === 0) d = d.slice(2);
    else if (d.charAt(0) === '0') d = '92' + d.slice(1);
    return d;
  }
  function resolve(to) {
    to = String(to).trim();
    if (/^[+0-9 ()-]{5,}$/.test(to)) return { name: to, number: to };
    var q = to.toLowerCase();
    var hits = Object.keys(contacts).filter(function (n) { return n.toLowerCase().indexOf(q) !== -1; });
    if (!hits.length) return { err: "'" + to + "' naam ka saved contact nahi hai. User se number poochein ya save_contact se save karein." };
    if (hits.length > 1) return { err: 'Kai contacts mile: ' + hits.join(', ') + '. User se poochein kaun sa.' };
    return { name: hits[0], number: contacts[hits[0]] };
  }
  function enc(s) { return encodeURIComponent(s); }

  var APPS = {
    whatsapp: 'https://wa.me/', youtube: 'https://www.youtube.com/', facebook: 'https://www.facebook.com/',
    instagram: 'https://www.instagram.com/', telegram: 'https://t.me/', x: 'https://x.com/', twitter: 'https://x.com/',
    gmail: 'mailto:', maps: 'https://www.google.com/maps', chrome: 'https://www.google.com/',
    'play store': 'https://play.google.com/store', playstore: 'https://play.google.com/store',
    phone: 'tel:', dialer: 'tel:', messages: 'sms:', tiktok: 'https://www.tiktok.com/'
  };

  function runTool(name, a) {
    switch (name) {
      case 'save_contact':
        contacts[String(a.name).trim()] = String(a.number).trim();
        LS.set('contacts', contacts);
        return 'Contact save kar liya.';
      case 'call': {
        var c = resolve(a.to); if (c.err) return c.err;
        card('Call: ' + c.name, c.number, 'tel:' + c.number.replace(/\s/g, ''), 'Call');
        return 'Call ka button dikha diya. User dabayega to dialer khulega.';
      }
      case 'send_sms': {
        var s = resolve(a.to); if (s.err) return s.err;
        card('SMS: ' + s.name, a.text, 'sms:' + s.number.replace(/\s/g, '') + '?body=' + enc(a.text), 'Kholein');
        return 'SMS ka button dikha diya. User ko messages app mein send dabana hoga.';
      }
      case 'whatsapp_message': {
        var w = resolve(a.to); if (w.err) return w.err;
        card('WhatsApp: ' + w.name, a.text, 'https://wa.me/' + pkNum(w.number) + '?text=' + enc(a.text), 'Kholein');
        return 'WhatsApp ka button dikha diya. User ko send dabana hoga.';
      }
      case 'send_email':
        card('Email' + (a.to ? ': ' + a.to : ''), a.subject + '\n\n' + a.body,
          'mailto:' + (a.to || '') + '?subject=' + enc(a.subject) + '&body=' + enc(a.body), 'Kholein');
        return 'Email ka button dikha diya. User ko send dabana hoga.';
      case 'open_app': {
        var n = String(a.name).toLowerCase().trim();
        var hit = Object.keys(APPS).filter(function (k) { return n === k || n.indexOf(k) !== -1 || k.indexOf(n) !== -1; })[0];
        if (!hit) return "Yeh app web version se nahi khul sakti. Android app version se khul sakti hai.";
        card('Kholein: ' + a.name, '', APPS[hit], 'Kholein');
        return 'Button dikha diya.';
      }
      case 'web_search':
        card('Search', a.query, 'https://www.google.com/search?q=' + enc(a.query), 'Kholein');
        return 'Search ka button dikha diya.';
      case 'youtube_search':
        card('YouTube', a.query, 'https://www.youtube.com/results?search_query=' + enc(a.query), 'Kholein');
        return 'YouTube ka button dikha diya.';
      case 'open_url': {
        var u = /^https?:\/\//.test(a.url) ? a.url : 'https://' + a.url;
        card('Website', u, u, 'Kholein');
        return 'Button dikha diya.';
      }
      case 'navigate':
        card('Rasta', a.place, 'https://www.google.com/maps/dir/?api=1&destination=' + enc(a.place), 'Maps');
        return 'Maps ka button dikha diya.';
      case 'remember':
        notes.push(String(a.text).trim()); notes = notes.slice(-50); LS.set('notes', notes);
        return 'Yaad rakh liya.';
      case 'forget': {
        var before = notes.length;
        notes = notes.filter(function (t) { return t.toLowerCase().indexOf(String(a.text).toLowerCase()) === -1; });
        LS.set('notes', notes);
        return notes.length < before ? 'Bhula diya.' : 'Aisi koi baat yaad nahi thi.';
      }
    }
    return 'Yeh kaam is web app se nahi hota: ' + name;
  }

  /* ---------- UI helpers ---------- */
  function toBottom() { feed.scrollTop = feed.scrollHeight; }
  function bubble(kind, text) {
    var el = document.createElement('div');
    el.className = 'msg ' + kind;
    el.setAttribute('dir', 'auto');
    el.textContent = text;
    feed.appendChild(el); toBottom();
    return el;
  }
  function card(title, detail, href, btn) {
    var el = document.createElement('div');
    el.className = 'card';
    var t = document.createElement('div'); t.className = 't';
    var b = document.createElement('b'); b.textContent = title; t.appendChild(b);
    if (detail) { var sp = document.createElement('span'); sp.setAttribute('dir', 'auto'); sp.textContent = detail; t.appendChild(sp); }
    var a = document.createElement('a'); a.href = href; a.textContent = btn; a.rel = 'noopener';
    el.appendChild(t); el.appendChild(a);
    feed.appendChild(el); toBottom();
  }
  function setStatus(t) { $('status').textContent = t; }
  function setMic(t, on) { mic.textContent = t; mic.classList.toggle('on', !!on); }
  function refresh() { hello.hidden = contents.length > 0 || busy; sendBtn.disabled = busy || !input.value.trim(); }
  function autosize() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 130) + 'px'; }

  /* ---------- Gemini ---------- */
  function systemPrompt() {
    var now = new Date().toLocaleString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    var names = Object.keys(contacts);
    var s = 'Tum "Anjoo AI" ho, Android phone ka awaazi assistant (web version).\n' +
      "User jis zubaan aur script mein likhe (Urdu, Roman Urdu, English) usi mein jawab do.\n" +
      'Jawab bohat chhote rakho (ek ya do jumle, bina markdown ya emoji), kyunke awaaz mein parhe jayenge.\n' +
      'Jo kaam tools se ho sakta hai wo karo. Call, SMS, WhatsApp, email aur app kholne ke liye tool user ko ek button dikhata hai jo user ko khud dabana hota hai; jawab mein bata do ke "button dabayein".\n' +
      'Yeh web version hai: alarm, torch, volume, music control, contacts mein khud dhoondna aur doosri apps ke andar kaam yahan nahi hote. Aisa kaam maange to saaf bata do ke Android app version chahiye.\n' +
      'Agar contact ka naam saved na ho to user se number poochho. "Yaad rakho" kehne par remember tool use karo.\n' +
      'Abhi ka waqt: ' + now + '.';
    if (names.length) s += '\nSaved contacts: ' + names.join(', ') + '.';
    if (notes.length) s += '\nYaad rakhi baatein:\n- ' + notes.join('\n- ');
    return s;
  }

  async function callGemini() {
    var body = {
      systemInstruction: { parts: [{ text: systemPrompt() }] },
      contents: contents,
      tools: [{ functionDeclarations: DECLS }],
      generationConfig: { maxOutputTokens: 1024 }
    };
    var r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-goog-api-key': key },
      body: JSON.stringify(body)
    });
    var text = await r.text();
    var j = null; try { j = JSON.parse(text); } catch (e) {}
    if (!r.ok) {
      var msg = (j && j.error && j.error.message) || text.slice(0, 200);
      if (r.status === 404) msg = "Model '" + model + "' nahi mila. Settings mein naam check karein.";
      else if (r.status === 429) msg = 'Limit khatam ya bohat requests. Thori der baad try karein.';
      else if (/API key/i.test(msg)) msg = 'API key galat hai. Settings mein dobara dalein.';
      throw new Error('(' + r.status + ') ' + msg);
    }
    return j;
  }

  function trim() {
    while (contents.length > 30) contents.shift();
    while (contents.length) {
      var m = contents[0], p = m.parts && m.parts[0];
      if (m.role === 'user' && p && p.text !== undefined) break;
      contents.shift();
    }
  }

  async function submit(text) {
    text = (text || '').trim();
    if (busy || !text) return;
    if (!key) { openSettings(); return; }
    speechSynthesis.cancel();
    busy = true;
    bubble('user', text);
    input.value = ''; autosize();
    var wait = document.createElement('div');
    wait.className = 'msg bot'; wait.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
    feed.appendChild(wait); toBottom();
    setStatus('Soch raha hoon...'); setMic('Soch raha hoon...'); refresh();

    trim();
    var start = contents.length;
    contents.push({ role: 'user', parts: [{ text: text }] });
    var finalText = '';
    try {
      for (var step = 0; step < 8; step++) {
        var resp = await callGemini();
        var cand = resp.candidates && resp.candidates[0];
        if (!cand) throw new Error('Jawab nahi mila.' + (resp.promptFeedback && resp.promptFeedback.blockReason ? ' ' + resp.promptFeedback.blockReason : ''));
        var parts = (cand.content && cand.content.parts) || [];
        if (parts.length) contents.push({ role: 'model', parts: parts });
        var results = [], said = '';
        parts.forEach(function (p) {
          if (p.functionCall) {
            var out;
            try { out = runTool(p.functionCall.name, p.functionCall.args || {}); }
            catch (e) { out = 'Kaam nahi ho saka: ' + e.message; }
            results.push({ functionResponse: { name: p.functionCall.name, response: { result: out } } });
          } else if (p.text && !p.thought) {
            said += p.text + ' ';
          }
        });
        if (said.trim()) finalText = said.trim();
        if (!results.length) break;
        contents.push({ role: 'user', parts: results });
      }
      wait.remove();
      if (finalText) { bubble('bot', finalText); speak(finalText); }
    } catch (e) {
      contents.length = start;
      wait.remove();
      bubble('err', 'Masla: ' + e.message);
    } finally {
      busy = false; setStatus('Tayyar'); setMic('Bolein'); refresh(); toBottom();
    }
  }

  /* ---------- voice ---------- */
  function speak(text) {
    try {
      var u = new SpeechSynthesisUtterance(text.replace(/[*_`#]/g, ''));
      u.lang = /[؀-ۿ]/.test(text) ? 'ur-PK' : 'en-IN';
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  function listen() {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { bubble('err', 'Is browser mein awaaz pehchaan nahi hai. Android par Chrome istemal karein.'); return; }
    if (busy) return;
    if (listening && rec) { rec.stop(); return; }
    if (!key) { openSettings(); return; }
    speechSynthesis.cancel();
    rec = new SR();
    rec.lang = lang; rec.interimResults = false; rec.maxAlternatives = 1;
    rec.onstart = function () { listening = true; setMic('Sun raha hoon... (rokne ke liye dabayein)', true); setStatus('Sun raha hoon'); };
    rec.onend = function () { listening = false; if (!busy) { setMic('Bolein'); setStatus('Tayyar'); } };
    rec.onerror = function (e) {
      listening = false; setMic('Bolein');
      var m = e.error === 'not-allowed' || e.error === 'service-not-allowed' ? 'Mic ki ijazat dein (address bar ke lock icon se).'
        : e.error === 'no-speech' ? 'Awaaz nahi aayi, dobara bolein.'
        : e.error === 'network' ? 'Internet check karein.' : 'Awaaz ka masla: ' + e.error;
      bubble('err', m);
    };
    rec.onresult = function (e) {
      var t = e.results[0] && e.results[0][0] && e.results[0][0].transcript;
      if (t) submit(t);
    };
    try { rec.start(); } catch (e) {}
  }

  /* ---------- settings ---------- */
  function openSettings() {
    $('keyIn').value = key;
    $('modelIn').value = model;
    $('contactsIn').value = Object.keys(contacts).map(function (n) { return n + ': ' + contacts[n]; }).join('\n');
    $('notesIn').value = notes.join('\n');
    var d = $('dlg');
    if (d.showModal) d.showModal(); else d.setAttribute('open', '');
  }
  $('setForm').addEventListener('submit', function (ev) {
    var action = ev.submitter && ev.submitter.value;
    if (action !== 'save') return;
    key = $('keyIn').value.trim();
    model = $('modelIn').value.trim() || DEFAULT_MODEL;
    var c = {};
    $('contactsIn').value.split('\n').forEach(function (line) {
      var i = line.lastIndexOf(':');
      if (i > 0) { var n = line.slice(0, i).trim(), v = line.slice(i + 1).trim(); if (n && v) c[n] = v; }
    });
    contacts = c;
    notes = $('notesIn').value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
    LS.set('key', key); LS.set('model', model); LS.set('contacts', contacts); LS.set('notes', notes);
  });

  /* ---------- wiring ---------- */
  $('form').addEventListener('submit', function (ev) { ev.preventDefault(); submit(input.value); });
  input.addEventListener('input', function () { autosize(); refresh(); });
  mic.addEventListener('click', listen);
  $('setBtn').addEventListener('click', openSettings);
  $('langBtn').addEventListener('click', function () {
    lang = lang === 'ur-PK' ? 'en-US' : 'ur-PK';
    $('langBtn').textContent = lang === 'ur-PK' ? 'اردو' : 'English';
  });
  $('chips').addEventListener('click', function (ev) {
    var b = ev.target.closest('.chip'); if (b) submit(b.textContent);
  });

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
  refresh();
  if (!key) setTimeout(openSettings, 400);
})();
</script>
</body>
</html>
