name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q AnjooAI.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: AnjooAI
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp AnjooAI/app/build/outputs/apk/debug/app-debug.apk AnjooAI.apk

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Anjoo AI APK ${{ github.run_number }}
          files: AnjooAI.apk
