name: Build APK

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Unzip newest project
        run: |
          ZIP=$(ls AnjooAI-v*.zip | sort -V | tail -1)
          echo "Using $ZIP"
          echo "ZIP_NAME=${ZIP%.zip}" >> "$GITHUB_ENV"
          # -o = overwrite without asking, -x = never touch the workflow file
          unzip -o -q "$ZIP" -x ".github/*"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          test -s "$APK" || { echo "APK missing or empty"; exit 1; }
          mkdir -p out
          cp "$APK" "out/${ZIP_NAME}.apk"
          ls -l out

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${ZIP_NAME}-build${{ github.run_number }}"
          gh release create "$TAG" "out/${ZIP_NAME}.apk" \
            --title "$ZIP_NAME" \
            --notes "Auto-built from ${ZIP_NAME}.zip"
